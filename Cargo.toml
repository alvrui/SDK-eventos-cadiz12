[package]
name = "cadiz12-sdk-eventos"
version = "0.1.0"
edition = "2021"
authors = ["Alvaro"]
description = "SDK de eventos narrativo-politicos para Cadiz 1812"
license = "MIT"
readme = "README.md"
keywords = ["cadiz1812", "sdk", "events", "narrative", "game"]
categories = ["game-development", "simulation"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
log = "0.4"
env_logger = "0.10"
lazy_static = "1.4"
hashbrown = "0.14"
strum = "0.25"
strum_macros = "0.25"
tiny_http = "0.12"
chrono = "0.4"

[dev-dependencies]
criterion = "0.5"
test-log = "0.2"
tempfile = "3.10"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[features]
default = []
full = []
